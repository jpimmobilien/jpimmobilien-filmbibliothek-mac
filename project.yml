# Xcode-Projekt (XcodeGen): `brew install xcodegen && xcodegen generate` → Filmbibliothek.xcodeproj
# Die Kernbibliotheken kommen aus dem lokalen Swift-Paket (Package.swift), VLCKit über dessen Binärziel.
# Vorher einmal `scripts/fetch_vlckit.sh` ausführen.
name: Filmbibliothek
options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  FilmbibliothekPaket:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  Filmbibliothek:
    type: application
    platform: macOS
    sources:
      - path: Sources/Filmbibliothek
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Filmbibliothek
        PRODUCT_BUNDLE_IDENTIFIER: de.privateapp.filmbibliothek
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/Filmbibliothek.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ARCHS: "$(ARCHS_STANDARD)"
        ONLY_ACTIVE_ARCH: NO
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: FilmbibliothekPaket
        product: FBCore
      - package: FilmbibliothekPaket
        product: FBStore
      - package: FilmbibliothekPaket
        product: FBServices
